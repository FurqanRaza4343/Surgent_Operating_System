server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # React Router uses client-side routes (/agents, /channels) — any path
    # that doesn't match a real file falls back to index.html so those routes
    # work on a direct load/refresh, not just client-side navigation.
    location / {
        try_files $uri $uri/ /index.html;
    }

    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }
}
